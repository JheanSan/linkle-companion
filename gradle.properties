# More memory for Gradle (Minecraft decompilation is heavy).
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric properties (pinned; see docs/DECISIONS.md). Check https://fabricmc.net/develop
# The Minecraft and Fabric API versions of each supported Minecraft version are in versions/*.properties.
# primary_mc is the one built by default (and the one datagen and the client tests use).
primary_mc=26.3
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# Mod properties
mod_version=1.2.0
maven_group=dev.linklecompanion
archives_base_name=linkle_companion

# Dependencies
# Optional integration (compile-only)
modmenu_version=21.0.0
