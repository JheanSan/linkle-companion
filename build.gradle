plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds Mojang, Fabric and Maven Central automatically.
	// This mod has no other dependencies, so nothing is needed here.
}

loom {
	// Keeps client-only code (rendering, HUD, screens) in src/client so a
	// dedicated server never loads it.
	splitEnvironmentSourceSets()

	mods {
		"linkle_companion" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Dev client always plays as the offline test name "DevTester".
		client {
			programArgs "--username", "DevTester"
		}
		// ./gradlew runJoinTestServer: dev client that joins the local test server in testserver/.
		joinTestServer {
			client()
			name = "Join local test server"
			runDir = "run-joinserver"
			programArgs "--username", "DevTester", "--quickPlayMultiplayer", "127.0.0.1:25566"
		}
	}
}

fabricApi {
	// ./gradlew runDatagen writes recipes, lang, tags and advancements to src/main/generated.
	configureDataGeneration()

	// Server game tests (src/gametest) run as part of ./gradlew build.
	// ./gradlew runClientGameTest opens the game and takes showcase screenshots of Linkle.
	configureTests {
		createSourceSet = true
		modId = "linkle_companion_gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
	from("ASSETS.md") {
		rename { "${it}_$projectName" }
	}
}
