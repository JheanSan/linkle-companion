plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// e.g. 1.0.0+mc26.3: the store-friendly convention of naming the Minecraft version in the mod version.
version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds Mojang, Fabric and Maven Central automatically.
	// Mod Menu is only needed at compile time for the optional "Configure" button.
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
		content { includeGroup "com.terraformersmc" }
	}
}

loom {
	// Keeps client-only code (rendering, HUD, screens) in src/client so a
	// dedicated server never loads it.
	splitEnvironmentSourceSets()

	mods {
		"linkle_companion" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Dev client always plays as the offline test name "DevTester".
		client {
			programArgs "--username", "DevTester"
		}
		// ./gradlew runJoinTestServer: dev client that joins the local test server in testserver/.
		joinTestServer {
			client()
			name = "Join local test server"
			runDir = "run-joinserver"
			programArgs "--username", "DevTester", "--quickPlayMultiplayer", "127.0.0.1:25566"
		}
	}
}

fabricApi {
	// ./gradlew runDatagen writes recipes, lang, tags and advancements to src/main/generated.
	configureDataGeneration()

	// Server game tests (src/gametest) run as part of ./gradlew build.
	// ./gradlew runClientGameTest opens the game and takes showcase screenshots of Linkle.
	configureTests {
		createSourceSet = true
		modId = "linkle_companion_gametest"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional integration: compile against Mod Menu's API only; it is not bundled or required.
	clientCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive = false
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
	from("ASSETS.md") {
		rename { "${it}_$projectName" }
	}
}

// Clean-install test: runs the BUILT jar the way a player would have it — a fresh game folder with
// only Fabric Loader, Fabric API and linkle_companion.jar — as offline "DevTester", joining the local
// test server in testserver/ (start that first). ./gradlew cleanInstallClient
def cleanInstallMods = configurations.detachedConfiguration(
	dependencies.create("net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}")
)
cleanInstallMods.transitive = false

tasks.register("cleanInstallClient", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	group = "verification"
	description = "Launches the built jar with only Fabric Loader + Fabric API in a fresh folder."
	// Loom adds this project's jar automatically; we add Fabric API next to it.
	// -PwithoutLinkle replaces the list with Fabric API only (a control run for troubleshooting).
	if (project.hasProperty("withoutLinkle")) {
		mods.setFrom(cleanInstallMods)
	} else {
		mods.from(cleanInstallMods)
	}
	// -Pcompat also loads the client-side mods downloaded into tools/compat (compatibility test).
	if (project.hasProperty("compat")) {
		mods.from(fileTree("tools/compat") {
			include "*.jar"
			exclude "flan-*", "lithostitched-*", "Terralith_*"
		})
	}
	runDir = layout.projectDirectory.dir("run-cleaninstall")
	jvmArgs.add("-XX:ErrorFile=" + layout.buildDirectory.file("crashlogs/hs_err_%p.log").get().asFile.path)
	programArgs.addAll("--username", "DevTester")
	// -PnoJoin stays on the title screen instead of joining the test server.
	if (!project.hasProperty("noJoin")) {
		programArgs.addAll("--quickPlayMultiplayer", "127.0.0.1:25566")
	}
	doFirst {
		delete(layout.projectDirectory.dir("run-cleaninstall"))
		// Start muted: these are unattended test runs.
		def options = layout.projectDirectory.file("run-cleaninstall/options.txt").asFile
		options.parentFile.mkdirs()
		options.text = "soundCategory_master:0.0" + System.lineSeparator()
	}
}

// Translations: every file in lang/ must have exactly the English keys and the same number of %s
// placeholders, so a missing or broken line fails the build instead of showing a raw key in game.
// Runs as part of ./gradlew build (check).
def checkTranslations = tasks.register("checkTranslations") {
	group = "verification"
	description = "Checks every Linkle language file against the generated en_us.json."
	def english = file("src/main/generated/assets/linkle_companion/lang/en_us.json")
	def langDir = file("src/main/resources/assets/linkle_companion/lang")
	def marker = layout.buildDirectory.file("checkTranslations.ok")
	inputs.file(english)
	inputs.dir(langDir)
	outputs.file(marker)
	doLast {
		def placeholders = { String text -> (text.replace("%%", "") =~ /%(\d+\$)?s/).size() }
		def reference = new groovy.json.JsonSlurper().parse(english, "UTF-8") as Map<String, String>
		def problems = []
		def files = langDir.listFiles().findAll { it.name.endsWith(".json") }.sort { it.name }
		files.each { lang ->
			def strings
			try {
				strings = new groovy.json.JsonSlurper().parse(lang, "UTF-8") as Map<String, Object>
			} catch (Exception e) {
				problems << "${lang.name}: not valid JSON (${e.message})"
				return
			}
			(reference.keySet() - strings.keySet()).each { problems << "${lang.name}: missing ${it}" }
			(strings.keySet() - reference.keySet()).each { problems << "${lang.name}: unknown key ${it}" }
			strings.each { key, value ->
				if (!(value instanceof String) || value.trim().isEmpty()) {
					problems << "${lang.name}: ${key} is empty"
				} else if (reference.containsKey(key) && placeholders(value) != placeholders(reference[key])) {
					problems << "${lang.name}: ${key} needs ${placeholders(reference[key])} %s placeholder(s)"
				}
			}
		}
		if (!problems.isEmpty()) {
			throw new GradleException("Translation problems:\n  " + problems.join("\n  "))
		}
		marker.get().asFile.text = "${files.size()} language files OK" + System.lineSeparator()
		println "checkTranslations: ${files.size()} language files match en_us (${reference.size()} keys)."
	}
}
tasks.named("check") {
	dependsOn checkTranslations
}
