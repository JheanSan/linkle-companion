name: Idea or suggestion
description: Suggest something new for Linkle
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like Linkle to do or look like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it be fun?
