# Push a tag like v1.2.0 to build, test and publish a release for every supported Minecraft version
# (one file per version in versions/).
#
# Always: one GitHub release with a jar per Minecraft version.
# Optional: also uploads each jar to Modrinth and/or CurseForge. Turn that on by adding, in the
# GitHub repo under Settings > Secrets and variables > Actions:
#   Variables: MODRINTH_ID (project id from the Modrinth page), CURSEFORGE_ID (project id from CurseForge)
#   Secrets:   MODRINTH_TOKEN (modrinth.com > Settings > PATs, scope "Create versions"),
#              CURSEFORGE_TOKEN (curseforge.com > My API Tokens)
# A platform without its token is skipped.
name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v6
      - id: list
        run: echo "list=$(ls versions/*.properties | xargs -n1 basename | sed 's/\.properties$//' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  build:
    needs: versions
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        mc: ${{ fromJson(needs.versions.outputs.list) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build and run game tests (Minecraft ${{ matrix.mc }})
        run: ./gradlew build -Pmc=${{ matrix.mc }}

      - name: Release notes and game versions
        id: meta
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md > RELEASE_NOTES.md
          echo "game_versions=$(grep '^game_versions=' versions/${{ matrix.mc }}.properties | cut -d= -f2 | tr ',' ' ')" >> "$GITHUB_OUTPUT"
          echo "jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Keep the jar for the GitHub release
        uses: actions/upload-artifact@v7
        with:
          name: jar-mc${{ matrix.mc }}
          path: ${{ steps.meta.outputs.jar }}

      - name: Modrinth
        if: ${{ vars.MODRINTH_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: ${{ steps.meta.outputs.jar }}
          name: Linkle Companion ${{ github.ref_name }} for Minecraft ${{ matrix.mc }}
          version-type: release
          changelog-file: RELEASE_NOTES.md
          loaders: fabric
          game-versions: ${{ steps.meta.outputs.game_versions }}
          java: 25
          dependencies: |
            fabric-api(required)
            modmenu(optional)

      - name: CurseForge
        if: ${{ vars.CURSEFORGE_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.meta.outputs.jar }}
          name: Linkle Companion ${{ github.ref_name }} for Minecraft ${{ matrix.mc }}
          version-type: release
          changelog-file: RELEASE_NOTES.md
          loaders: fabric
          game-versions: ${{ steps.meta.outputs.game_versions }}
          java: 25
          dependencies: |
            fabric-api(required)
            modmenu(optional)

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Release notes (newest CHANGELOG section)
        run: awk '/^## /{n++} n==1' CHANGELOG.md > RELEASE_NOTES.md
      - name: Collect the jars
        uses: actions/download-artifact@v7
        with:
          pattern: jar-mc*
          path: jars
          merge-multiple: true
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Linkle Companion ${{ github.ref_name }}
          files: jars/*.jar
          body_path: RELEASE_NOTES.md
