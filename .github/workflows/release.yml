# Push a tag like v1.0.0 to build, test and publish a release.
#
# Always: creates a GitHub release with the jar attached.
# Optional: also uploads the same file to Modrinth and/or CurseForge. Turn that on by adding, in the
# GitHub repo under Settings > Secrets and variables > Actions:
#   Variables: MODRINTH_ID (project id from the Modrinth page), CURSEFORGE_ID (project id from CurseForge)
#   Secrets:   MODRINTH_TOKEN (modrinth.com > Settings > PATs, scope "Create versions"),
#              CURSEFORGE_TOKEN (curseforge.com > My API Tokens)
# A platform without its token is skipped.
name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build and run game tests
        run: ./gradlew build

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Linkle Companion ${{ github.ref_name }}
          files: build/libs/linkle_companion-*.jar
          body_path: CHANGELOG.md

      - name: Modrinth
        if: ${{ vars.MODRINTH_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            build/libs/!(*-sources).jar
          name: Linkle Companion ${{ github.ref_name }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: fabric
          game-versions: 26.3
          java: 25
          dependencies: |
            fabric-api(required)
            modmenu(optional)

      - name: CurseForge
        if: ${{ vars.CURSEFORGE_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            build/libs/!(*-sources).jar
          name: Linkle Companion ${{ github.ref_name }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: fabric
          game-versions: 26.3
          java: 25
          dependencies: |
            fabric-api(required)
            modmenu(optional)
