# Push a tag like v1.0.0 to build the mod and attach the jar to a GitHub release.
name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build and run game tests
        run: ./gradlew build
      - name: Create GitHub release with the jar
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/linkle_companion-*.jar
          generate_release_notes: true
